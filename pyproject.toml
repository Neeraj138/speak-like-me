[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speak-like-me"
version = "0.1.0"
description = "Offline-first redaction and preparation of personal writing exports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private project" }
dependencies = []

[project.optional-dependencies]
presidio = [
  "presidio-analyzer>=2.2.360",
  "presidio-anonymizer>=2.2.360",
]

[project.scripts]
slm-redact = "speak_like_me.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/speak_like_me"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

